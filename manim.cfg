# Project-wide Manim defaults. Applies to any `manim` run from the repo root.
# Anything passed on the command line wins over what's set here.

[CLI]
# --- Format: 16:9, 30fps ---
# These are the *final* delivery specs. `-qh` renders 1920x1080 @ 60fps by
# default, so we pin frame_rate here to keep the whole series at 30.
frame_rate = 30
pixel_width = 1920
pixel_height = 1080

# --- Look ---
# Dark background. Kept in sync with BG in common/theme.py — if you change one,
# change the other. Manim needs it here (it paints the canvas before any scene
# code runs); the scenes need it there (to pick contrasting colors).
background_color = #12141C
background_opacity = 1

# --- Output ---
# All render products go under output/, which is gitignored.
# render.py overrides --media_dir per video (output/_work/<video>/) so two
# videos whose scene files are both named scenes.py can't collide.
media_dir = output

# --- Preview profile ---
# `manim -pql videos/<name>/scenes.py <Scene>` is the fast path.
# -ql drops to 854x480 @ 15fps, which is the point: iterate on timing and
# staging, not on pixels. Flush the cache-check on every run so edits to
# common/ are always picked up in a preview.
flush_cache = False
disable_caching = False
preview = False

# Quiet the banner; render.py prints its own progress.
verbosity = WARNING
notify_outdated_version = False

[logger]
log_width = 120
